<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>민원서비스 검색 - 민원서비스 목록 조회</title>
<style>
:root {
  --primary: #003764;
  --primary-light: #0b6fb8;
  --accent: #2e9e5b;
  --bg: #f5f7fa;
  --card: #ffffff;
  --text: #1a1a1a;
  --text-sub: #666666;
  --border: #e1e6eb;
  --badge-online: #d4edda;
  --badge-online-text: #155724;
  --badge-offline: #f8d7da;
  --badge-offline-text: #721c24;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Malgun Gothic', '맑은 고딕', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
.header {
  background: var(--primary);
  color: #fff;
  padding: 28px 16px 24px;
  text-align: center;
}
.header h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.header p { font-size: 14px; opacity: 0.85; }
.container { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
.controls {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.search-box {
  flex: 1;
  min-width: 200px;
  padding: 10px 14px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}
.search-box:focus { border-color: var(--primary-light); }
.filter-select {
  min-width: 150px;
  padding: 10px 14px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  background: var(--card);
  outline: none;
  cursor: pointer;
  transition: border-color 0.2s;
}
.filter-select:focus { border-color: var(--primary-light); }
.count-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-size: 14px;
  color: var(--text-sub);
}
.count-bar strong { color: var(--primary); font-size: 16px; }
.reset-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 12px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  color: var(--text-sub);
  transition: background 0.2s;
}
.reset-btn:hover { background: var(--border); }
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
thead th {
  background: var(--primary);
  color: #fff;
  padding: 12px 10px;
  font-size: 14px;
  font-weight: 600;
  text-align: left;
  white-space: nowrap;
}
tbody tr { transition: background 0.15s; }
tbody tr:nth-child(even) { background: #f9fafb; }
tbody tr:hover { background: #e8f0fe; }
tbody td {
  padding: 10px;
  font-size: 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}
.badge-yes { background: var(--badge-online); color: var(--badge-online-text); }
.badge-no { background: var(--badge-offline); color: var(--badge-offline-text); }
.fee { text-align: right; }
.deadline { text-align: center; }
.no-result {
  text-align: center;
  padding: 40px 16px;
  color: var(--text-sub);
  font-size: 15px;
}
.footer {
  text-align: center;
  padding: 20px 16px;
  font-size: 12px;
  color: var(--text-sub);
}
@media (max-width: 640px) {
  .header h1 { font-size: 20px; }
  .controls { flex-direction: column; }
  table { font-size: 13px; display: block; overflow-x: auto; }
  thead th, tbody td { padding: 8px 6px; font-size: 13px; }
}
</style>
</head>
<body>
<div class="header">
  <h1>민원서비스 검색</h1>
  <p>서비스명 검색 및 민원분야 필터로 원하는 서비스를 빠르게 찾아보세요</p>
</div>
<div class="container">
  <div class="controls">
    <input type="text" id="searchInput" class="search-box" placeholder="서비스명을 입력하세요 (예: 발급, 신고, 조회)">
    <select id="filterSelect" class="filter-select">
      <option value="">전체 민원분야</option>
    </select>
  </div>
  <div class="count-bar">
    <span>검색 결과 <strong id="countDisplay">22</strong>건</span>
    <button class="reset-btn" id="resetBtn">초기화</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>서비스명</th>
        <th>소관기관</th>
        <th>민원분야</th>
        <th>온라인처리</th>
        <th class="deadline">처리기한</th>
        <th class="fee">수수료</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="no-result" id="noResult" style="display:none;">검색 결과가 없습니다.</div>
</div>
<div class="footer">© 2025 민원서비스 검색 시스템</div>

<script>
const DATA = [
  {"서비스ID":"S001","서비스명":"주민등록등본 발급","소관기관":"주민센터","민원분야":"주민등록","온라인처리":"가능","처리기한일":7,"수수료":500},
  {"서비스ID":"S002","서비스명":"전입신고","소관기관":"복지정책과","민원분야":"주민등록","온라인처리":"불가","처리기한일":1,"수수료":0},
  {"서비스ID":"S003","서비스명":"인감증명 발급","소관기관":"복지정책과","민원분야":"주민등록","온라인처리":"가능","처리기한일":1,"수수료":0},
  {"서비스ID":"S004","서비스명":"주민등록증 재발급","소관기관":"건축과","민원분야":"주민등록","온라인처리":"가능","처리기한일":0,"수수료":0},
  {"서비스ID":"S005","서비스명":"건축물대장 발급","소관기관":"구청 민원봉사과","민원분야":"건축","온라인처리":"불가","처리기한일":0,"수수료":1000},
  {"서비스ID":"S006","서비스명":"건축허가 신청","소관기관":"건축과","민원분야":"건축","온라인처리":"불가","처리기한일":1,"수수료":2000},
  {"서비스ID":"S007","서비스명":"용도변경 신고","소관기관":"시청 민원과","민원분야":"건축","온라인처리":"불가","처리기한일":0,"수수료":0},
  {"서비스ID":"S008","서비스명":"지방세 납부확인서","소관기관":"건축과","민원분야":"세무","온라인처리":"가능","처리기한일":1,"수수료":1000},
  {"서비스ID":"S009","서비스명":"취득세 신고","소관기관":"교통행정과","민원분야":"세무","온라인처리":"가능","처리기한일":0,"수수료":0},
  {"서비스ID":"S010","서비스명":"재산세 조회","소관기관":"교통행정과","민원분야":"세무","온라인처리":"가능","처리기한일":3,"수수료":0},
  {"서비스ID":"S011","서비스명":"기초연금 신청","소관기관":"건축과","민원분야":"복지","온라인처리":"가능","처리기한일":7,"수수료":500},
  {"서비스ID":"S012","서비스명":"복지급여 조회","소관기관":"시청 민원과","민원분야":"복지","온라인처리":"가능","처리기한일":14,"수수료":5000},
  {"서비스ID":"S013","서비스명":"장애인 등록","소관기관":"주민센터","민원분야":"복지","온라인처리":"가능","처리기한일":5,"수수료":0},
  {"서비스ID":"S014","서비스명":"자동차 등록","소관기관":"주민센터","민원분야":"교통","온라인처리":"가능","처리기한일":1,"수수료":5000},
  {"서비스ID":"S015","서비스명":"운전면허 갱신","소관기관":"교통행정과","민원분야":"교통","온라인처리":"불가","처리기한일":1,"수수료":0},
  {"서비스ID":"S016","서비스명":"주정차 위반 조회","소관기관":"주민센터","민원분야":"교통","온라인처리":"가능","처리기한일":7,"수수료":1000},
  {"서비스ID":"S017","서비스명":"배출시설 신고","소관기관":"주민센터","민원분야":"환경","온라인처리":"가능","처리기한일":1,"수수료":0},
  {"서비스ID":"S018","서비스명":"폐기물 처리 신청","소관기관":"시청 민원과","민원분야":"환경","온라인처리":"가능","처리기한일":14,"수수료":5000},
  {"서비스ID":"S019","서비스명":"식품영업 신고","소관기관":"건축과","민원분야":"위생","온라인처리":"가능","처리기한일":3,"수수료":2000},
  {"서비스ID":"S020","서비스명":"위생업소 조회","소관기관":"시청 민원과","민원분야":"위생","온라인처리":"불가","처리기한일":7,"수수료":500},
  {"서비스ID":"S021","서비스명":"여권 발급 신청","소관기관":"건축과","민원분야":"여권","온라인처리":"가능","처리기한일":7,"수수료":1000},
  {"서비스ID":"S022","서비스명":"여권 재발급","소관기관":"교통행정과","민원분야":"여권","온라인처리":"가능","처리기한일":1,"수수료":1000}
];

const searchInput = document.getElementById('searchInput');
const filterSelect = document.getElementById('filterSelect');
const tableBody = document.getElementById('tableBody');
const countDisplay = document.getElementById('countDisplay');
const noResult = document.getElementById('noResult');
const resetBtn = document.getElementById('resetBtn');

const categories = [...new Set(DATA.map(d => d.민원분야))];
categories.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c;
  opt.textContent = c;
  filterSelect.appendChild(opt);
});

function formatFee(fee) {
  if (fee === 0) return '무료';
  return fee.toLocaleString() + '원';
}

function render() {
  const keyword = searchInput.value.trim().toLowerCase();
  const category = filterSelect.value;

  const filtered = DATA.filter(item => {
    const matchSearch = !keyword || item.서비스명.toLowerCase().includes(keyword);
    const matchFilter = !category || item.민원분야 === category;
    return matchSearch && matchFilter;
  });

  countDisplay.textContent = filtered.length;

  if (filtered.length === 0) {
    tableBody.innerHTML = '';
    noResult.style.display = 'block';
    return;
  }

  noResult.style.display = 'none';
  tableBody.innerHTML = filtered.map(item => `<tr>
    <td>${item.서비스명}</td>
    <td>${item.소관기관}</td>
    <td>${item.민원분야}</td>
    <td><span class="badge ${item.온라인처리 === '가능' ? 'badge-yes' : 'badge-no'}">${item.온라인처리}</span></td>
    <td class="deadline">${item.처리기한일 === 0 ? '즉시' : item.처리기한일 + '일'}</td>
    <td class="fee">${formatFee(item.수수료)}</td>
  </tr>`).join('');
}

searchInput.addEventListener('input', render);
filterSelect.addEventListener('change', render);
resetBtn.addEventListener('click', () => {
  searchInput.value = '';
  filterSelect.value = '';
  render();
});

render();
</script>
</body>
</html>
